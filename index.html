<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>China GEO Control</title>

  <style>
    body {
      margin: 0;
      padding: 30px 16px;
      background: #08111f;
      color: #eaf2ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .update-time {
      color: #9fb3c8;
      margin: 18px 0;
      font-size: 15px;
    }

    button {
      width: 100%;
      max-width: 420px;
      padding: 16px;
      margin: 10px auto;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #updateBtn {
      background: #1677ff;
      color: white;
    }

    #updateBtn:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .link {
      display: block;
      max-width: 390px;
      margin: 12px auto;
      padding: 15px;
      border: 1px solid #29415e;
      border-radius: 12px;
      color: #dbeaff;
      text-decoration: none;
      background: #101d2f;
    }

    #status {
      min-height: 26px;
      margin: 14px;
      color: #7fd6ff;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🛰 China GEO Control</h1>

  <div class="update-time">
    最終更新：
    <span id="lastUpdated">読み込み中...</span>
  </div>

  <button id="updateBtn" onclick="startUpdate()">
    🔄 最新TLEで更新
  </button>

  <div id="status"></div>

  <a class="link" href="china_map.html">
    🗺 中国GEOマップを見る
  </a>

  <a class="link" href="china_geo.csv">
    📄 CSVを見る
  </a>

</div>

<script>

const WORKER_URL =
  "https://satellite-map-updater.shingo48691014.workers.dev/china";

let previousUpdate = "";

async function loadLastUpdated() {
  try {
    const response = await fetch(
      "last_updated.txt?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("取得失敗");
    }

    const text = (await response.text()).trim();

    document.getElementById("lastUpdated").textContent = text;

    return text;

  } catch (error) {
    document.getElementById("lastUpdated").textContent =
      "取得できません";

    return "";
  }
}

async function startUpdate() {

  const button = document.getElementById("updateBtn");
  const status = document.getElementById("status");

  button.disabled = true;

  previousUpdate = await loadLastUpdated();

  status.textContent = "🔄 更新要求を送信しています...";

  try {

    const response = await fetch(WORKER_URL, {
      method: "POST"
    });

    const result = await response.json();

    if (!response.ok || !result.ok) {
      throw new Error("更新開始に失敗");
    }

    status.textContent = "⏳ GitHub Actionsで更新中...";

    waitForUpdate();

  } catch (error) {

    status.textContent = "❌ 更新要求に失敗しました";

    button.disabled = false;
  }
}

async function waitForUpdate() {

  const button = document.getElementById("updateBtn");
  const status = document.getElementById("status");

  let count = 0;

  const timer = setInterval(async () => {

    count++;

    const current = await loadLastUpdated();

    if (
      current &&
      previousUpdate &&
      current !== previousUpdate
    ) {

      clearInterval(timer);

      status.textContent = "✅ 更新完了！";

      button.disabled = false;

      return;
    }

    if (count >= 24) {

      clearInterval(timer);

      status.textContent =
        "⚠ 更新処理は継続中です。少し後で確認してください。";

      button.disabled = false;
    }

  }, 5000);
}

loadLastUpdated();

</script>

</body>
</html>
