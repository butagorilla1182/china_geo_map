const map =
    L.map("map").setView([0, 120], 2);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 6,
        attribution: "OpenStreetMap"
    }
).addTo(map);


function catOf(r) {

    const n =
        String(r.name || "").toUpperCase();

    const lat =
        Math.abs(parseFloat(r.lat || "0"));

    if (lat > 3)
        return [
            "#dd6b20",
            "移動中・傾斜軌道",
            "南北方向への移動が大きい衛星です。傾斜軌道または軌道変更中の可能性があります。"
        ];

    if (n.includes("TIANLIAN"))
        return [
            "#2b6cb0",
            "データ中継",
            "天鏈（Tianlian）系列のデータ中継衛星候補です。"
        ];

    if (
        n.includes("CHINASAT") ||
        n.includes("ZHONGXING") ||
        n.includes("ZX-") ||
        n.includes("APSTAR")
    )
        return [
            "#c53030",
            "中国通信衛星",
            "中国系の通信衛星候補です。"
        ];

    if (
        n.includes("FENGYUN") ||
        n.includes("FY-")
    )
        return [
            "#2f855a",
            "気象・観測",
            "風雲（Fengyun）系列の気象・観測衛星候補です。"
        ];

    if (
        n.includes("BEIDOU") ||
        n.includes("COMPASS")
    )
        return [
            "#6b46c1",
            "測位・航法",
            "北斗（BeiDou）系列の測位衛星候補です。"
        ];

    return [
        "#718096",
        "未分類",
        "現在の分類条件では未分類の衛星です。"
    ];
}


function popupOf(r) {

    const c = catOf(r);

    return (
        "<b>" + r.name + "</b><br>" +

        "<span style='" +
        "display:inline-block;" +
        "margin:4px 0;" +
        "padding:2px 8px;" +
        "border-radius:10px;" +
        "background:" + c[0] + ";" +
        "color:white;" +
        "font-size:12px;" +
        "'>" +

        c[1] +

        "</span><br>" +

        "<b>NORAD ID：</b>" +
        r.norad + "<br>" +

        "<b>緯度：</b>" +
        r.lat + "°<br>" +

        "<b>経度：</b>" +
        r.lon + "°<br>" +

        "<b>高度：</b>" +
        r.alt_km + " km<br>" +

        "<hr>" +

        "<b>国・地域：</b>中国系候補<br>" +

        "<b>分類：</b>" +
        c[1] + "<br>" +

        "<b>任務メモ：</b>" +
        c[2]
    );
}


data.forEach(r => {

    const c = catOf(r);

    L.circleMarker(
        [
            parseFloat(r.lat),
            parseFloat(r.lon)
        ],
        {
            radius: 8,
            color: "#1a202c",
            weight: 1,
            fillColor: c[0],
            fillOpacity: 0.9
        }
    )
    .addTo(map)
    .bindPopup(popupOf(r));
});


const legend =
    L.control({
        position: "bottomleft"
    });


legend.onAdd = function() {

    const div =
        L.DomUtil.create(
            "div",
            "info legend"
        );

    div.style.background = "white";
    div.style.padding = "10px";
    div.style.borderRadius = "8px";
    div.style.boxShadow =
        "0 1px 5px rgba(0,0,0,0.3)";
    div.style.fontSize = "13px";

    div.innerHTML =

        "<div><span style='display:inline-block;width:12px;height:12px;background:#2b6cb0;border-radius:50%;margin-right:6px;'></span>データ中継</div>" +

        "<div><span style='display:inline-block;width:12px;height:12px;background:#c53030;border-radius:50%;margin-right:6px;'></span>中国通信衛星</div>" +

    return div;
};
