/* =========================================================
   発射場コード → 日本語
   ========================================================= */

const LAUNCH_SITES = {

    "WSC":
        "文昌衛星発射場",

    "XICLF":
        "西昌衛星発射センター",

    "JSC":
        "酒泉衛星発射センター",

    "TAISC":
        "太原衛星発射センター",

    "SCSLA":
        "南シナ海打上げ区域",

    "YSLA":
        "黄海打上げ区域",

    "SEAL":
        "シーローンチ海上発射施設",

    "UNK":
        "不明"
};



function launchSiteName(code) {

    if (!code) {
        return "不明";
    }


    const key =
        String(
            code
        )
        .trim()
        .toUpperCase();


    const name =
        LAUNCH_SITES[key];


    if (name) {

        return (
            name +
            "（" +
            key +
            "）"
        );
    }


    /*
     * 未登録コードは
     * 略号をそのまま表示
     */
    return key;
}



/* =========================================================
   衛星カテゴリ
   ========================================================= */

function catOf(r) {

    const n =
        String(
            r.name || ""
        ).toUpperCase();


    const lat =
        Math.abs(
            parseFloat(
                r.lat || "0"
            )
        );


    /*
     * GEOから南北に大きく外れている
     */
    if (lat > 3) {

        return [
            "#dd6b20",
            "移動中・傾斜大",
            "GEO付近だが南北方向の変動が大きい衛星"
        ];
    }


    /*
     * TIANLIAN
     */
    if (
        n.includes(
            "TIANLIAN"
        )
    ) {

        return [
            "#2b6cb0",
            "データ中継",
            "天鏈データ中継衛星系"
        ];
    }


    /*
     * 中国通信衛星
     */
    if (
        n.includes("CHINASAT") ||
        n.includes("ZHONGXING") ||
        n.includes("ZX-") ||
        n.includes("APSTAR")
    ) {

        return [
            "#c53030",
            "通信",
            "中国系静止通信衛星"
        ];
    }


    /*
     * 気象
     */
    if (
        n.includes("FENGYUN") ||
        n.includes("FY-")
    ) {

        return [
            "#2f855a",
            "気象・観測",
            "風雲系気象・地球観測衛星"
        ];
    }


    /*
     * BeiDou
     */
    if (
        n.includes("BEIDOU") ||
        n.includes("COMPASS")
    ) {

        return [
            "#6b46c1",
            "測位・航法",
            "北斗衛星測位システム"
        ];
    }


    return [
        "#718096",
        "未整理",
        "用途未整理"
    ];
}



/* =========================================================
   打上げ情報
   ========================================================= */

function formatLaunchDate(date) {

    if (!date) {
        return "不明";
    }


    return date.replaceAll(
        "-",
        "/"
    );
}



function launchAgeOf(date) {

    if (!date) {
        return "不明";
    }


    const launch =
        new Date(
            date +
            "T00:00:00Z"
        );


    if (
        Number.isNaN(
            launch.getTime()
        )
    ) {

        return "不明";
    }


    const diff =
        Date.now() -
        launch.getTime();


    if (diff < 0) {

        return "未打上げ";
    }


    const days =
        Math.floor(
            diff /
            86400000
        );


    if (days < 365) {

        return (
            days +
            "日"
        );
    }


    const years =
        Math.floor(
            days /
            365.2425
        );


    const remainDays =
        Math.floor(
            days -
            years *
            365.2425
        );


    return (
        years +
        "年 " +
        remainDays +
        "日"
    );
}



/* =========================================================
   TLE経過時間
   ========================================================= */

function ageOf(epochIso) {

    const epoch =
        new Date(
            epochIso
        );


    if (
        Number.isNaN(
            epoch.getTime()
        )
    ) {

        return "不明";
    }


    let diff =
        Date.now() -
        epoch.getTime();


    const future =
        diff < 0;


    diff =
        Math.abs(
            diff
        );


    const totalMinutes =
        Math.floor(
            diff /
            60000
        );


    const days =
        Math.floor(
            totalMinutes /
            1440
        );


    const hours =
        Math.floor(
            (
                totalMinutes %
                1440
            ) /
            60
        );


    const minutes =
        totalMinutes %
        60;


    let text = "";


    if (days > 0) {

        text +=
            days +
            "日 ";
    }


    text +=
        hours +
        "時間" +
        minutes +
        "分";


    return future
        ? "未来 " + text
        : text;
}



/* =========================================================
   TLE鮮度
   ========================================================= */

function freshnessOf(epochIso) {

    const epoch =
        new Date(
            epochIso
        );


    if (
        Number.isNaN(
            epoch.getTime()
        )
    ) {

        return {
            color: "#718096",
            icon: "⚪",
            text: "不明"
        };
    }


    const ageHours =
        (
            Date.now() -
            epoch.getTime()
        ) /
        3600000;


    if (ageHours < 24) {

        return {
            color: "#16a34a",
            icon: "🟢",
            text: "新鮮"
        };
    }


    if (ageHours < 72) {

        return {
            color: "#ca8a04",
            icon: "🟡",
            text: "やや古い"
        };
    }


    if (ageHours < 168) {

        return {
            color: "#ea580c",
            icon: "🟠",
            text: "古い"
        };
    }


    return {
        color: "#dc2626",
        icon: "🔴",
        text: "要注意"
    };
}

    );
}



/* =========================================================
   マーカー
   ========================================================= */

const satelliteMarkers = [];


data.forEach(r => {

    const c =
        catOf(r);


    const marker =
        L.circleMarker(

            [
                parseFloat(
                    r.lat
                ),

                parseFloat(
                    r.lon
                )
            ],

            {
                radius: 8,
                color: "#1a202c",
                weight: 1,
                fillColor: c[0],
                fillOpacity: 0.9
            }
        )

        .addTo(map)

        .bindPopup(
            popOf(r),
            {
                maxWidth: 420
            }
        );


    satelliteMarkers.push({

        data: r,

        marker: marker
    });
});



/* =========================================================
   検索文字列正規化

   ZHONGXING-19
   zhongxing19
   Zhongxing 19

   全部同じ扱い
   ========================================================= */

function normalizeSearch(value) {

    return String(
        value || ""
    )

    .toUpperCase()

    .replace(
        /[^A-Z0-9]/g,
        ""
    );
}



/* =========================================================
   衛星検索
   ========================================================= */

function searchSatellite() {

    const input =
        document.getElementById(
            "satSearch"
        );


    const result =
        document.getElementById(
            "searchResult"
        );


    const query =
        normalizeSearch(
            input.value.trim()
        );


    if (!query) {

        result.textContent =
            "衛星名かNORAD IDを入力してください";

        return;
    }



    /*
     * 完全一致
     */
    let found =
        satelliteMarkers.find(
            item => {

                const name =
                    normalizeSearch(
                        item.data.name
                    );


                const norad =
                    normalizeSearch(
                        item.data.norad
                    );


                return (
                    name === query ||
                    norad === query
                );
            }
        );



    /*
     * 部分一致
     */
    if (!found) {

        found =
            satelliteMarkers.find(
                item => {

                    const name =
                        normalizeSearch(
                            item.data.name
                        );


                    const norad =
                        normalizeSearch(
                            item.data.norad
                        );


                    return (
                        name.includes(
                            query
                        ) ||

                        norad.includes(
                            query
                        )
                    );
                }
            );
    }



    if (!found) {

        result.textContent =
            "❌ 該当する衛星がありません";

        return;
    }



    const r =
        found.data;


    const marker =
        found.marker;



    /* 衛星位置へ移動 */

    map.setView(

        [
            parseFloat(
                r.lat
            ),

            parseFloat(
                r.lon
            )
        ],

        5,

        {
            animate: true
        }
    );



    /* 詳細を開く */

    marker.openPopup();



    /* 一時的に強調 */

    marker.setRadius(
        14
    );


    setTimeout(

        function() {

            marker.setRadius(
                8
            );
        },

        2500
    );



    result.textContent =
        "✅ " +
        r.name +
        " / NORAD " +
        r.norad;
}



/* =========================================================
   検索ボタン
   ========================================================= */

document
    .getElementById(
        "searchButton"
    )
    .addEventListener(

        "click",

        searchSatellite
    );



/* =========================================================
   Enterでも検索
   ========================================================= */

document
    .getElementById(
        "satSearch"
    )
    .addEventListener(

        "keydown",

        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                event.preventDefault();

                searchSatellite();
            }
        }
    );

            legendBox.style.display =

        }

    function() {

        const legendBox =
            document.getElementById(
                "satLegend"
            );


        if (legendBox) {

            legendBox.style.display =
                "block";
        }
    }
);
